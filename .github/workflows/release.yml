name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.PLUGIN_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/plugin.jks"
          chmod 600 "$RUNNER_TEMP/plugin.jks"
          echo "PLUGIN_KEYSTORE_FILE=$RUNNER_TEMP/plugin.jks" >> "$GITHUB_ENV"
      - name: Validate manifest and build
        env:
          PLUGIN_KEYSTORE_PASSWORD: ${{ secrets.PLUGIN_KEYSTORE_PASSWORD }}
        run: |
          python3 scripts/check-plugin.py
          python3 scripts/test-import-packaging.py
          ./gradlew :plugin:assembleRelease :plugin:lintRelease :plugin:testReleaseUnitTest --no-daemon
          python3 scripts/verify-import-packaging.py plugin/build/outputs/apk/release/plugin-release.apk --mapping plugin/build/outputs/mapping/release/mapping.txt
      - name: Package release
        run: |
          cp plugin/build/outputs/apk/release/plugin-release.apk plugin.apk
          sha256sum plugin.apk > plugin.apk.sha256
          sha256sum plugin.json > plugin.json.sha256
          version=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          echo "PLUGIN_TAG=v$version" >> "$GITHUB_ENV"
          git archive HEAD -o plugin-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: music-import-plugin
          path: |
            plugin.apk
            plugin.json
            plugin.apk.sha256
            plugin.json.sha256
            plugin/build/outputs/mapping/release/mapping.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLUGIN_TAG }}
          files: |
            plugin.apk
            plugin.json
            plugin.apk.sha256
            plugin.json.sha256
            plugin-source.tar
          generate_release_notes: true
